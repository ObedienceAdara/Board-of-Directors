[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"formal_agents.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
files = ["models", "app", "agents", "analysis", "orchestration", "reports", "tools", "utils"]

[tool.pytest.ini_options]
markers = [
  "staging: credentialed integration test; requires real Groq, Tavily, Notion credentials",
]
testpaths = ["tests"]
