name: Staging Integration
on:
  push:
    branches:
      - main
      - phase0-runtime-verification
  workflow_dispatch:
jobs:
  staging:
    name: Real Groq + Tavily + Notion + PDF board run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      RATE_LIMIT_PER_MINUTE: "30"
    steps:
      - name: Clone repository
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .
      - name: Python version
        run: python3 --version
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate staging secrets exist
        run: |
          test -n "$GROQ_API_KEY"
          test -n "$TAVILY_API_KEY"
          test -n "$NOTION_API_KEY"
          test -n "$NOTION_DATABASE_ID"
      - name: Run credentialed integration test
        run: python3 -m pytest -q tests/test_staging_integration.py -m staging
