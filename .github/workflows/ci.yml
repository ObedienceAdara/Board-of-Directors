name: CI

on:
  push:
    branches: [main, phase0-runtime-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint + type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  tests:
    name: Deterministic + mocked runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Import smoke test
        run: python -c "import main; print('main import: OK')"
      - name: Unit and scheduler tests
        run: pytest -q -m 'not staging'

  staging:
    name: Credentialed staging integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      RATE_LIMIT_PER_MINUTE: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate staging secrets exist
        run: |
          test -n "$GROQ_API_KEY"
          test -n "$TAVILY_API_KEY"
          test -n "$NOTION_API_KEY"
          test -n "$NOTION_DATABASE_ID"
      - name: Real board run
        run: pytest -q tests/test_staging_integration.py -m staging
